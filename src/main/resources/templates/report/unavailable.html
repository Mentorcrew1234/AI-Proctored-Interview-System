<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Report Unavailable')}"></head>
<body class="app">
<div th:replace="~{fragments/layout :: sidebar('reports')}"></div>

<div class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Report unavailable')}"></div>

    <!-- Reached by all three roles, so the way back follows the role: a
         candidate has no reports page to return to. -->
    <main class="page page-narrow">
        <div class="card">
            <div class="empty">
                <div class="empty-mark" aria-hidden="true">&#9888;</div>
                <div class="empty-title">This report is not available</div>
                <p th:text="${message}">Not available.</p>
                <p class="hint">
                    A report exists only once the candidate has finished their interview, and a
                    candidate can see their own result only if the recruiter chose to share it.
                </p>
                <div style="display:flex;gap:8px;justify-content:center">
                    <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/admin/reports}">Back to reports</a>
                    <a sec:authorize="hasRole('RECRUITER')" class="btn" th:href="@{/recruiter/reports}">Back to reports</a>
                    <a sec:authorize="hasRole('CANDIDATE')" class="btn" th:href="@{/}">Back to my interviews</a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
