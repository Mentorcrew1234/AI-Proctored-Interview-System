<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head th:replace="~{fragments/layout :: head('Interview Unavailable')}"></head>
<body class="app">
<div th:replace="~{fragments/layout :: sidebar('interviews')}"></div>

<div class="app-main">
    <div th:replace="~{fragments/layout :: topbar('Interview unavailable')}"></div>

    <!-- An error state, not a blank page: it says what happened in plain words
         and offers the way back, rather than a stack trace. -->
    <main class="page page-narrow">
        <div class="card">
            <div class="empty">
                <div class="empty-mark" aria-hidden="true">&#9888;</div>
                <div class="empty-title">This interview is not available</div>
                <p th:text="${message}">Not available.</p>
                <div style="display:flex;gap:8px;justify-content:center">
                    <a sec:authorize="hasRole('ADMIN')" class="btn"
                       th:href="@{/admin/interviews}">Back to interviews</a>
                    <a sec:authorize="hasRole('RECRUITER')" class="btn"
                       th:href="@{/recruiter/interviews}">Back to interviews</a>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
